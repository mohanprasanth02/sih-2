name: labelguard_mobile
description: "LabelGuard AI - Field Inspector Mobile Application for Legal Metrology Packaged Commodities Rules 2011"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  dio: ^5.4.1
  web_socket_channel: ^2.4.5
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  geolocator: ^11.0.0
  intl: ^0.19.0
  uuid: ^4.3.3
  image: ^4.1.7
  cached_network_image: ^3.3.1
  share_plus: ^8.0.2
  open_file: ^3.3.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
